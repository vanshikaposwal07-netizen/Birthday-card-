<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Happy Birthday, Rajan 🎂</title>
<style>
  :root{
    --pageW: clamp(140px, 44vw, 260px);
    --pageH: calc(var(--pageW) / 0.5635);
    --spine-shadow: rgba(0,0,0,0.35);
    --ink: #4a3524;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.10), transparent 60%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 6px),
      linear-gradient(160deg, #c9a876 0%, #b8925f 45%, #a97f4d 100%);
    overflow-x:hidden;
  }
  #stage{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 9vh 12px 40px 12px;
    perspective: 1800px;
  }
  h1.title{
    margin: 0 0 18px 0;
    font-size: clamp(20px,5vw,28px);
    letter-spacing: 1px;
    color: #4a2e1a;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    text-align:center;
  }

  /* ---------- BOOK ---------- */
  #book{
    position:relative;
    width: var(--pageW);
    height: var(--pageH);
    margin: 0 auto;
    transition: width 0.85s cubic-bezier(.4,0,.2,1);
    transform-style: preserve-3d;
  }
  #book.open{ width: calc(var(--pageW) * 2); }

  .spread{
    position:absolute; inset:0;
    display:flex; flex-direction:row;
    overflow:hidden;
    border-radius: 10px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.25);
    background:#efe6d3;
  }
  .page{
    width: var(--pageW);
    height: 100%;
    flex: 0 0 var(--pageW);
    position:relative;
    overflow:hidden;
    background-size: cover;
    background-position:center;
  }
  #book.open .page-left{ box-shadow: inset -14px 0 22px -14px var(--spine-shadow); }
  #book.open .page-right{ box-shadow: inset 14px 0 22px -14px var(--spine-shadow); }

  .page-left{ cursor:pointer; }
  .page-left img.envelope-img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; user-select:none; -webkit-user-drag:none;
  }
  .letter-lift{
    position:absolute;
    left:50%; top:46%;
    width:76%;
    aspect-ratio: 976 / 1744;
    transform: translate(-50%,-38%) scale(0.5) rotate(-7deg);
    opacity:0;
    transition: transform 0.55s cubic-bezier(.34,1.2,.4,1), opacity 0.45s ease;
    pointer-events:none;
    z-index:5;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.45));
    border-radius: 4px;
    overflow:hidden;
  }
  .letter-lift img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; user-select:none; -webkit-user-drag:none; }
  .page-left.lifted .letter-lift{
    transform: translate(-50%,-50%) scale(0.98) rotate(0deg);
    opacity:1;
    z-index:20;
  }
  .tap-hint{
    position:absolute; left:50%; bottom:6%; transform:translateX(-50%);
    background: rgba(255,255,255,0.85); color:#7a4a2e; font-size: clamp(9px,2.4vw,11px);
    padding: 4px 9px; border-radius: 20px; white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
    pointer-events:none; opacity:0.95; z-index:6;
    animation: hintPulse 2.2s ease-in-out infinite;
  }
  @keyframes hintPulse{ 0%,100%{opacity:0.55;} 50%{opacity:1;} }

  .page-right{ background:#efe6d3; }
  .page-right img.cake-img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; user-select:none; -webkit-user-drag:none;
  }
  .flame{
    position:absolute;
    transform-origin: 50% 92%;
    pointer-events:none;
    filter: drop-shadow(0 0 6px rgba(255,170,60,0.55));
    transition: opacity 0.35s ease, filter 0.3s ease;
    will-change: transform;
  }
  .flame img{ width:100%; height:100%; display:block; object-fit:contain; }
  .flame.out{ opacity:0; }

  /* ---------- COVER FLAPS ---------- */
  .cover-flap{
    position:absolute; top:0; height:100%;
    width: calc(var(--pageW) / 2);
    background-repeat:no-repeat;
    background-size: var(--pageW) 100%;
    z-index: 50;
    box-shadow: 0 10px 26px rgba(0,0,0,0.35);
    transition: transform 0.85s cubic-bezier(.4,0,.2,1), opacity 0.3s ease 0.45s;
    cursor:pointer;
    border-radius: 10px;
  }
  .cover-flap.left{
    left:0; background-position: 0 0;
    transform-origin: right center;
    border-radius: 10px 0 0 10px;
  }
  .cover-flap.right{
    right:0; background-position: calc(-1 * var(--pageW) / 2) 0;
    transform-origin: left center;
    border-radius: 0 10px 10px 0;
  }
  #book.open .cover-flap.left{ transform: rotateY(-112deg); opacity:0; pointer-events:none; }
  #book.open .cover-flap.right{ transform: rotateY(112deg); opacity:0; pointer-events:none; }
  .cover-flap-hint{
    position:absolute; left:50%; bottom:5%; transform:translateX(-50%);
    background: rgba(255,255,255,0.85); color:#7a2e4a; font-size: clamp(10px,2.6vw,12px);
    padding: 5px 12px; border-radius:20px; white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
    animation: hintPulse 2.2s ease-in-out infinite;
    z-index:60;
  }
  #book.open .cover-flap-hint{ display:none; }

  /* ---------- BUTTONS ---------- */
  .btn{
    font-family: Georgia, serif;
    border:none; border-radius: 24px;
    padding: 10px 18px;
    font-size: clamp(13px,3.2vw,15px);
    cursor:pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active{ transform: scale(0.94); box-shadow:0 2px 6px rgba(0,0,0,0.25); }
  .btn-pink{ background: linear-gradient(160deg,#ff9fb0,#e8607e); color:#fff; }
  .btn-cream{ background: linear-gradient(160deg,#fff6e6,#f0dbb0); color:#6b4423; }

  #backToCoverBtn{
    margin-top: 22px;
    opacity:0; pointer-events:none;
    transition: opacity 0.4s ease 0.35s;
  }
  #backToCoverBtn.show{ opacity:1; pointer-events:auto; }

  .candle-controls{
    position:absolute; left:0; right:0; bottom:8px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    z-index:30;
    padding: 0 6px;
  }
  #levelMeterWrap{
    width:82%; height:9px; background:rgba(255,255,255,0.35);
    border-radius:6px; overflow:hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.5);
  }
  #levelMeter{
    height:100%; width:0%;
    background: linear-gradient(90deg,#7fd858,#ffd23f,#ff5f5f);
    transition: width 0.06s linear;
  }
  #micLabel{
    font-size: clamp(8.5px,2.2vw,10px);
    color:#5a3d22;
    background:rgba(255,255,255,0.75);
    padding:2px 8px; border-radius:10px;
  }
  #holdBlowBtn{
    padding: 8px 16px;
    font-size: clamp(12px,3vw,13px);
    user-select:none;
  }

  /* ---------- WISH OVERLAY ---------- */
  .wish-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    background: radial-gradient(circle at 50% 45%, rgba(255,247,225,0.96), rgba(255,235,200,0.94) 70%);
    text-align:center; padding: 10%;
    opacity:0; pointer-events:none;
    transition: opacity 0.5s ease;
    z-index:40;
    border-radius: 10px;
  }
  .wish-overlay.show{ opacity:1; pointer-events:auto; }
  .wish-text{
    font-size: clamp(15px,4.6vw,19px);
    color:#a3305a;
    font-weight:bold;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }
  .wish-sub{ font-size: clamp(10px,2.6vw,12px); color:#7a4a2e; }

  #confettiCanvas{
    position:fixed; inset:0; width:100vw; height:100vh;
    pointer-events:none; z-index:999;
  }

  .note{
    margin-top:14px; max-width: 320px; text-align:center;
    font-size: clamp(10px,2.6vw,11.5px); color:#5a3d22; opacity:0.85;
    background:rgba(255,255,255,0.4); padding:8px 12px; border-radius:10px;
  }
</style>
</head>
